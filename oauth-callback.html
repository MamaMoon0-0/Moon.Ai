<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Authenticating... — Moon.ai</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" href="/MoonLogo.png" type="image/png">
  <style>
    .callback-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 40px;
    }
    .spinner {
      width: 60px;
      height: 60px;
      border: 4px solid var(--accent-2);
      border-top: 4px solid var(--accent);
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 24px;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .callback-message {
      font-size: 18px;
      color: var(--accent);
      margin-bottom: 12px;
      font-weight: 600;
    }
    .callback-details {
      font-size: 14px;
      color: var(--text-primary);
      opacity: 0.7;
    }
  </style>
</head>
<body>
  <div class="callback-container">
    <div class="spinner"></div>
    <div class="callback-message">Completing authentication...</div>
    <div class="callback-details">Please wait while we sign you in.</div>
  </div>

  <script>
    // Handle OAuth callback
    (function() {
      try {
        const params = new URLSearchParams(window.location.search);
        const hash = new URLSearchParams(window.location.hash.substring(1));
        
        // Check for error
        const error = params.get('error') || hash.get('error');
        if (error) {
          const errorDesc = params.get('error_description') || hash.get('error_description') || error;
          console.error('OAuth error:', errorDesc);
          document.querySelector('.callback-message').textContent = 'Authentication failed';
          document.querySelector('.callback-details').textContent = errorDesc;
          document.querySelector('.spinner').style.display = 'none';
          
          setTimeout(() => {
            window.location.href = '/index.html';
          }, 3000);
          return;
        }

        // Get authorization code or access token
        const code = params.get('code') || hash.get('code');
        const accessToken = params.get('access_token') || hash.get('access_token');
        const idToken = params.get('id_token') || hash.get('id_token');
        const state = params.get('state') || hash.get('state');

        if (code || accessToken || idToken) {
          // Store tokens temporarily
          if (accessToken) {
            sessionStorage.setItem('oauth_access_token', accessToken);
          }
          if (idToken) {
            sessionStorage.setItem('oauth_id_token', idToken);
          }
          if (code) {
            sessionStorage.setItem('oauth_code', code);
          }
          if (state) {
            sessionStorage.setItem('oauth_state', state);
          }

          // Parse ID token if available
          if (idToken) {
            try {
              // Note: In production, ID tokens should be verified server-side
              // This client-side parsing is for demo purposes only
              const payload = JSON.parse(atob(idToken.split('.')[1]));
              const userData = {
                provider: 'oauth',
                id: payload.sub,
                email: payload.email,
                name: payload.name || payload.email,
                picture: payload.picture,
                token: idToken,
                tokenExpiry: Date.now() + 3600000
              };
              localStorage.setItem('moon_user', JSON.stringify(userData));
            } catch (e) {
              console.error('Failed to parse ID token:', e);
            }
          }

          document.querySelector('.callback-message').textContent = 'Success!';
          document.querySelector('.callback-details').textContent = 'Redirecting to your dashboard...';
          
          setTimeout(() => {
            // Redirect back to main page
            window.location.href = '/index.html';
          }, 1500);
        } else {
          console.warn('No authorization code or token found in callback');
          document.querySelector('.callback-message').textContent = 'No authentication data received';
          document.querySelector('.callback-details').textContent = 'Redirecting back...';
          document.querySelector('.spinner').style.display = 'none';
          
          setTimeout(() => {
            window.location.href = '/index.html';
          }, 2000);
        }
      } catch (error) {
        console.error('Callback processing error:', error);
        document.querySelector('.callback-message').textContent = 'Something went wrong';
        document.querySelector('.callback-details').textContent = error.message;
        document.querySelector('.spinner').style.display = 'none';
        
        setTimeout(() => {
          window.location.href = '/index.html';
        }, 3000);
      }
    })();

    // Apply theme immediately
    document.addEventListener('DOMContentLoaded', () => {
      const savedTheme = localStorage.getItem('theme') || 'light';
      document.documentElement.setAttribute('data-theme', savedTheme);
    });
  </script>
</body>
</html>
